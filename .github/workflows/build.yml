name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test platform-neutral core
        run: swift run --package-path core VoiceToTextCoreChecks

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate scripts and plists
        run: ./scripts/check.sh
      - name: Test platform-neutral core
        run: swift run --package-path core VoiceToTextCoreChecks
      - name: Swift self-tests
        run: swift run -c debug --package-path swift VoiceToText --self-test all
      - name: Build app bundle
        run: ./scripts/build-app.sh "$RUNNER_TEMP/VoiceToText.app"
      - name: Verify app bundle
        run: |
          test -x "$RUNNER_TEMP/VoiceToText.app/Contents/MacOS/VoiceToText"
          codesign --verify --deep --strict "$RUNNER_TEMP/VoiceToText.app"
      - name: Exercise installer and uninstaller
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VoiceToText.app" "$RUNNER_TEMP/release/VoiceToText.zip"
          checksum="$(shasum -a 256 "$RUNNER_TEMP/release/VoiceToText.zip" | awk '{print $1}')"
          VOICE_TO_TEXT_RELEASE_URL="file://$RUNNER_TEMP/release/VoiceToText.zip" \
          VOICE_TO_TEXT_RELEASE_SHA256="$checksum" \
          VOICE_TO_TEXT_NO_OPEN=1 \
            ./install.sh
          test -x /Applications/VoiceToText.app/Contents/MacOS/VoiceToText
          codesign --verify --deep --strict /Applications/VoiceToText.app
          ./uninstall.sh
          test ! -e /Applications/VoiceToText.app
